query Plan($bikeReluctance: Reluctance, $carReluctance: Reluctance, $dateTime: PlanDateTimeInput, $origin: PlanLabeledLocationInput!, $modes: PlanModesInput, $numItineraries: Int, $includeRealTimeCancellations: Boolean, $destination: PlanLabeledLocationInput!, $walkReluctance: Reluctance, $walkSpeed: Speed, $wheelchair: Boolean, $via: [PlanViaLocationInput!], $mobilityProfile: String) {
  planConnection(
    dateTime: $dateTime
    destination: $destination
    first: $numItineraries
    locale: "en"
		mobilityProfile: $mobilityProfile
    modes: $modes
    origin: $origin
    preferences: {accessibility: {wheelchair: {enabled: $wheelchair}}, street: {bicycle: {reluctance: $bikeReluctance}, car: {reluctance: $carReluctance}, walk: {speed: $walkSpeed, reluctance: $walkReluctance}}, transit: {timetable: {includeRealTimeCancellations: $includeRealTimeCancellations}}}
    via: $via
  ) {
    edges {
      node {
        accessibilityScore
        duration
        endTime
        legs {
          accessibilityScore
          agency {
            alerts {
              alertDescriptionText
              alertHeaderText
              alertUrl
              effectiveStartDate
              id
            }
            gtfsId
            id: gtfsId
            name
            timezone
            url
          }
          alerts {
            alertDescriptionText
            alertHeaderText
            alertUrl
            effectiveStartDate
            id
          }
          arrivalDelay
          departureDelay
          distance
          dropOffBookingInfo {
            contactInfo {
              bookingUrl
              infoUrl
              phoneNumber
            }
            earliestBookingTime {
              daysPrior
              time
            }
            latestBookingTime {
              daysPrior
              time
            }
            message
          }
          dropoffType
          duration
          endTime
          fareProducts {
            id
            product {
              __typename
              id
              medium {
                id
                name
              }
              name
              riderCategory {
                id
                name
              }
              ... on DefaultFareProduct {
                price {
                  amount
                  currency {
                    code
                    digits
                  }
                }
              }
            }
          }
          from {
            lat
            lon
            name
            rentalVehicle {
              id
              network
            }
            stop {
              alerts {
                alertDescriptionText
                alertHeaderText
                alertUrl
                effectiveStartDate
                id
              }
              code
              gtfsId
              id
              lat
              lon
            }
            vertexType
          }
          headsign
          id
          interlineWithPreviousLeg
          intermediateStops {
            lat
            locationType
            lon
            name
            stopCode: code
            stopId: id
          }
          legGeometry {
            length
            points
          }
          mode
          pickupBookingInfo {
            contactInfo {
              bookingUrl
              infoUrl
              phoneNumber
            }
            earliestBookingTime {
              daysPrior
              time
            }
            latestBookingTime {
              daysPrior
              time
            }
            message
          }
          pickupType
          realTime
          realtimeState
          rentedBike
          rideHailingEstimate {
            arrival
            maxPrice {
              amount
              currency {
                code
              }
            }
            minPrice {
              amount
              currency {
                code
              }
            }
            provider {
              id
            }
          }
          route {
            alerts {
              alertDescriptionText
              alertHeaderText
              alertUrl
              effectiveStartDate
              id
            }
            color
            gtfsId
            id: gtfsId
            longName
            shortName
            textColor
            type
          }
          startTime
          steps {
            absoluteDirection
            alerts {
              alertDescriptionText
              alertHeaderText
              alertUrl
              effectiveStartDate
              id
            }
            area
            distance
            elevationProfile {
              distance
              elevation
            }
            lat
            lon
            relativeDirection
            stayOn
            streetName
          }
          
          to {
            lat
            lon
            name
            rentalVehicle {
              id
              network
            }
            stop {
              alerts {
                alertDescriptionText
                alertHeaderText
                alertUrl
                effectiveStartDate
                id
              }
              code
              gtfsId
              id
              lat
              lon
            }
            vertexType
          }
          transitLeg
          trip {
            arrivalStoptime {
              stop {
                gtfsId
                id
              }
              stopPosition
            }
            blockId
            departureStoptime {
              stop {
                gtfsId
                id
              }
              stopPosition
            }
            gtfsId
            id
          }
        }
        startTime
        transfers: numberOfTransfers
        waitingTime
        walkTime
      }
    }
    routingErrors {
      code
      description
      inputField
    }
  }
}